[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrain"
version = "0.1.0"
description = "Wanxiang automated training pipeline - M1 Trainer Runner"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.1",
    "pyyaml",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["autotrain*"]
